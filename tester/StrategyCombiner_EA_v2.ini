; MetaTrader 5 Strategy Tester config for StrategyCombiner_EA_v2
; Copy to the terminal folder or start with:
;   terminal64.exe /config:tester\StrategyCombiner_EA_v2.ini
;
; Real tester start error was NOT a missing INI.
; Tester failed because iCustom used a variable name and/or Combiner OnInit
; failed. EA v2 loads the literal "comb082" and ships
; #property tester_indicator "comb082"
; Compile Indicators/comb082.mq5 BEFORE starting the tester.

[Common]
Login=0
ProxyEnable=0
CertInstall=0
NewsEnable=0

[Tester]
Expert=StrategyCombiner_EA_v2
ExpertParameters=StrategyCombiner_EA_v2.set
Symbol=EURUSD
Period=H1
Optimization=0
Model=1
FromDate=2025.01.01
ToDate=2025.06.01
ForwardMode=0
Deposit=10000
Currency=USD
ProfitInPips=0
Leverage=100
ExecutionMode=0
OptimizationCriterion=0
Visual=0
ReplaceReport=1
ShutdownTerminal=0
Report=comb082_EA_v2_report
